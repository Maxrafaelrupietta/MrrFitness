<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MRR Fitness Öffnen</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1220;
      color: #e8eef7;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      width: min(520px, 100%);
      background: #131d2c;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 22px;
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    p { color: #9fb0c2; }
    a {
      display: inline-block;
      margin-right: 8px;
      margin-top: 8px;
      text-decoration: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 700;
    }
    a.open { background: #47e08a; color: #081018; }
    a.store { background: rgba(255,255,255,0.1); color: #e8eef7; }
  </style>
</head>
<body>
  <main class="card">
    <h1>MRR Fitness wird geöffnet</h1>
    <p>Falls die App nicht installiert ist, leiten wir dich in den App Store weiter.</p>
    <a id="openApp" class="open" href="#">App öffnen</a>
    <a id="openStore" class="store" href="#">App Store</a>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var deepLink = params.get("deeplink") || "mrrfitness://open?tab=home";
      var storeURL = params.get("store") || "https://apps.apple.com/de/search?term=MRR%20Fitness";

      var openApp = document.getElementById("openApp");
      var openStore = document.getElementById("openStore");
      openApp.href = deepLink;
      openStore.href = storeURL;

      var appOpened = false;
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) appOpened = true;
      });

      function openWithFallback() {
        window.location.href = deepLink;
        window.setTimeout(function () {
          if (!appOpened) {
            window.location.href = storeURL;
          }
        }, 1400);
      }

      window.setTimeout(openWithFallback, 220);
    })();
  </script>
</body>
</html>
